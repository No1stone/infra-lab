apiVersion: v1
kind: ConfigMap
metadata:
  name: vault-config
  namespace: vault
data:
  vault.hcl: |
    ui = true
    disable_mlock = true

    storage "inmem" {}

    listener "tcp" {
      address     = "0.0.0.0:8200"
      tls_disable = 1
    }

    # lab: vault operator init / unseal은 별도 ops.
    # root token은 Secret 또는 init 출력으로만 관리 (ConfigMap에 넣지 않음).

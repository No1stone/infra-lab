apiVersion: v1
kind: Service
metadata:
  name: rollouts-demo-stable
  namespace: ops-rollouts
spec:
  type: ClusterIP
  selector:
    app: rollouts-demo
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: rollouts-demo-canary
  namespace: ops-rollouts
spec:
  type: ClusterIP
  selector:
    app: rollouts-demo
  ports:
    - name: http
      port: 80
      targetPort: http

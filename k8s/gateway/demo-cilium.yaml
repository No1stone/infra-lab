# GatewayClass cilium — Cilium Helm(gatewayAPI.enabled) 설치 시 자동 생성. 여기서는 Gateway+HTTPRoute만 관리.
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: demo-cilium
  namespace: ingress-compare
spec:
  gatewayClassName: cilium
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      hostname: demo.cilium.lab.origemite.com
      allowedRoutes:
        namespaces:
          from: Same
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: demo-cilium
  namespace: ingress-compare
spec:
  parentRefs:
    - name: demo-cilium
      sectionName: http
  hostnames:
    - demo.cilium.lab.origemite.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: demo-echo
          port: 80

# GatewayClass istio — istio-gateway Helm 설치 시 자동 생성. 여기서는 Gateway+HTTPRoute만 관리.
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: demo-istio
  namespace: ingress-compare
spec:
  gatewayClassName: istio
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      hostname: demo.istio.lab.origemite.com
      allowedRoutes:
        namespaces:
          from: Same
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: demo-istio
  namespace: ingress-compare
spec:
  parentRefs:
    - name: demo-istio
      sectionName: http
  hostnames:
    - demo.istio.lab.origemite.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: demo-echo
          port: 80

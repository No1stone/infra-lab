# Ingress API는 host에 와일드카드(*.lab)를 허용하지 않음.
# 서브도메인별 Ingress(vault, rabbitmq 등)가 개별 호스트를 담당하고,
# 아래 lab.origemite.com은 nginx 네임스페이스 기본 백엔드용 catch-all이다.
# AWS 프록시가 *.lab.origemite.com 트래픽을 클러스터로 넘기며,
# NGINX Ingress는 server-alias 어노테이션으로 와일드카드 별칭을 추가할 수 있다.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: lab
  namespace: nginx
  annotations:
    nginx.ingress.kubernetes.io/server-alias: "*.lab.origemite.com"
spec:
  ingressClassName: nginx
  rules:
    - host: lab.origemite.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: nginx
                port:
                  number: 80

# Ingress API는 host에 와일드카드 단독을 허용하지 않음.
# 랩 공개 호스트는 3뎁스만: <앱>.<게이트웨이>.lab.origemite.com
# 2뎁스(<앱>.lab.origemite.com)는 쓰지 않는다.
# nginx catch-all: *.nginx.lab.origemite.com → 기본 백엔드.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: lab
  namespace: nginx
  annotations:
    nginx.ingress.kubernetes.io/server-alias: "*.nginx.lab.origemite.com"
spec:
  ingressClassName: nginx
  rules:
    - host: lab.nginx.lab.origemite.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: nginx
                port:
                  number: 80

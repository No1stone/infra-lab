apiVersion: apps/v1
kind: Deployment
metadata:
  name: ops-hpa-web
  namespace: ops-hpa
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ops-hpa-web
  template:
    metadata:
      labels:
        app: ops-hpa-web
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - name: http
              containerPort: 80
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10

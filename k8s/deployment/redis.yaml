apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      nodeSelector:
        lab.origemite.com/workload: redis
      containers:
        - name: redis
          image: redis:7
          ports:
            - containerPort: 6379

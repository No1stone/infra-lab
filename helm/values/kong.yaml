# kong/kong. Ingress Controller + Kong proxy.
# 호스트는 values에 두지 않음 → k8s/ingress/demo-kong.yaml (demo.kong.lab.origemite.com)
# MetalLB: 172.18.255.204
replicaCount: 1

ingressController:
  enabled: true
  ingressClass: kong

proxy:
  enabled: true
  type: LoadBalancer
  loadBalancerIP: "172.18.255.204"
  annotations:
    metallb.universe.tf/loadBalancerIPs: "172.18.255.204"

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: 200m
    memory: 256Mi

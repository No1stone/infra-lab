# haproxytech/kubernetes-ingress. IngressClass haproxy.
# MetalLB IP: k3d docker bridge 대역 — 실제 docker network에 맞게 수정.
controller:
  replicaCount: 1
  ingressClass: haproxy
  ingressClassResource:
    name: haproxy
    default: false
  service:
    type: LoadBalancer
    loadBalancerIP: "172.18.255.207"
    annotations:
      metallb.universe.tf/loadBalancerIPs: "172.18.255.207"
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi

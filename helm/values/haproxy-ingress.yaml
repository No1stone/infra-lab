# haproxytech/kubernetes-ingress. IngressClass haproxy.
# 호스트는 values에 두지 않음 → k8s/ingress/demo-haproxy.yaml (demo.haproxy.lab.origemite.com)
# MetalLB: 172.18.255.207
controller:
  replicaCount: 1
  ingressClass: haproxy
  ingressClassResource:
    name: haproxy
    default: false
  service:
    type: LoadBalancer
    loadBalancerIP: "172.18.255.207"
    annotations:
      metallb.universe.tf/loadBalancerIPs: "172.18.255.207"
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi

# traefik/traefik. 기본 IngressClass 아님 — nginx와 병행 실습용.
# 호스트는 values에 두지 않음 → k8s/ingress/demo-traefik.yaml (demo.traefik.lab.origemite.com)
# MetalLB: 172.18.255.205
deployment:
  replicas: 1

ingressClass:
  enabled: true
  isDefaultClass: false
  name: traefik

providers:
  kubernetesIngress:
    ingressClass: traefik

service:
  type: LoadBalancer
  annotations:
    metallb.universe.tf/loadBalancerIPs: "172.18.255.205"

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: 200m
    memory: 256Mi

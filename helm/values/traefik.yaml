# traefik/traefik. 기본 IngressClass 아님 — nginx와 병행 실습용.
# MetalLB IP: k3d docker bridge 대역 — 실제 docker network에 맞게 수정.
deployment:
  replicas: 1

ingressClass:
  enabled: true
  isDefaultClass: false
  name: traefik

providers:
  kubernetesIngress:
    ingressClass: traefik

service:
  type: LoadBalancer
  annotations:
    metallb.universe.tf/loadBalancerIPs: "172.18.255.205"

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: 200m
    memory: 256Mi

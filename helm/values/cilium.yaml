# cilium/cilium. k3d lab CNI.
# K3D_FIX_MOUNTS=1 필요. 클러스터 recreate 권장.
# flannel과 잠시 공존 후 cni.exclusive: true 로 전환.
# kubeProxyReplacement: true — Service LB 깨지면 partial 로 낮춘다.

operator:
  replicas: 1
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi

ipam:
  mode: kubernetes

cni:
  exclusive: true

kubeProxyReplacement: true

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

# Gateway API만 사용. Cilium Ingress Controller는 비활성.
gatewayAPI:
  enabled: true

ingressController:
  enabled: false

hubble:
  enabled: true
  relay:
    enabled: true
    replicas: 1
    resources:
      requests:
        cpu: 25m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 256Mi
  ui:
    enabled: true
    replicas: 1
    resources:
      requests:
        cpu: 25m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 256Mi

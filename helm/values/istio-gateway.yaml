# istio/gateway. Gateway API / Istio ingress gateway.
# 호스트는 values에 두지 않음 → k8s/gateway/demo-istio.yaml (demo.istio.lab.origemite.com)
# MetalLB: 172.18.255.206
replicaCount: 1

autoscaling:
  enabled: false

service:
  type: LoadBalancer
  annotations:
    metallb.universe.tf/loadBalancerIPs: "172.18.255.206"

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: 200m
    memory: 256Mi

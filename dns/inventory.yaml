# Route53 / DNS inventory (참조 전용)
#
# origemite.com = 개인용 도메인. 이 저장소에서 생성, 변경, 삭제하지 않는다.
# destroy / terraform destroy / 랩 초기화 시 DNS, 프록시 실제 인프라에 손대지 않는다.
#
# 랩 공개 FQDN 규칙 (3뎁스만):
# <앱>.<게이트웨이>.lab.origemite.com
# 예: argocd.nginx.lab…, demo.istio.lab…
# 2뎁스(<앱>.lab.origemite.com)는 쓰지 않는다.
#
# apply / aws route53 / terraform aws_route53_* 금지.

personal_zone: origemite.com
personal_zone_mutable_from_this_repo: false
managed_outside: true
hostname_depth: 3
# future_lab_zone: null

# --- “이미 있거나 쓸 이름” 표기. 생성 명령이 아니다. ---

# 게이트웨이별 와일드카드 (외부 관리). 2뎁스 *.lab.origemite.com 은 랩에서 사용 안 함.
gateway_subzone_wildcards:
 # - name: "*.nginx.lab.origemite.com"
 # - name: "*.gateway.lab.origemite.com"
 # - name: "*.cilium.lab.origemite.com"
 # - name: "*.kong.lab.origemite.com"
 # - name: "*.traefik.lab.origemite.com"
 # - name: "*.istio.lab.origemite.com"
 # - name: "*.haproxy.lab.origemite.com"

